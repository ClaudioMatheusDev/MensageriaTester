version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"  # Porta do RabbitMQ
      - "15672:15672"  # Porta do Management UI (http://localhost:15672)
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=password

  produto-service:
    build:
      context: ./ProdutoService
      dockerfile: Dockerfile
    ports:
      - "5001:80"
    depends_on:
      - rabbitmq

  carrinho-service:
    build:
      context: ./CarrinhoService
      dockerfile: Dockerfile
    ports:
      - "5002:80"
    depends_on:
      - rabbitmq
      - produto-service

  pedido-service:
    build:
      context: ./PedidoService
      dockerfile: Dockerfile
    ports:
      - "5003:80"
    depends_on:
      - rabbitmq
      - produto-service
      - carrinho-service

  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    depends_on:
      - produto-service
      - carrinho-service
      - pedido-service